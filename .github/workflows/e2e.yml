name: End-to-end

# Runs real external-dns with this webhook in a kind cluster against a real
# Contabo zone. It needs Contabo credentials, so it never runs for pull
# requests from forks. It runs on main, before every release, once a week
# (to catch Contabo API changes early) and on demand.
on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "test/e2e/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "17 6 * * 3" # every Wednesday
  workflow_dispatch:
  workflow_call:

# Only one run at a time, so runs never fight over the zone or the rate limit.
concurrency:
  group: e2e
  cancel-in-progress: false

permissions: {}

jobs:
  e2e:
    name: kind + Contabo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: external-dns-contabo-webhook:e2e
          build-args: |
            VERSION=e2e
            COMMIT=${{ github.sha }}
          cache-from: type=gha
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: e2e
      - name: Load image into kind
        run: kind load docker-image external-dns-contabo-webhook:e2e --name e2e
      - name: Install dig
        run: command -v dig || (sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils)
      - name: Run end-to-end test
        env:
          CONTABO_CLIENT_ID: ${{ secrets.CONTABO_CLIENT_ID }}
          CONTABO_CLIENT_SECRET: ${{ secrets.CONTABO_CLIENT_SECRET }}
          CONTABO_API_USER: ${{ secrets.CONTABO_API_USER }}
          CONTABO_API_PASSWORD: ${{ secrets.CONTABO_API_PASSWORD }}
          E2E_ZONE: ${{ vars.E2E_ZONE }}
          E2E_TARGET_IPS: ${{ vars.E2E_TARGET_IPS }}
          E2E_IMAGE: external-dns-contabo-webhook:e2e
        run: |
          export E2E_ID="gh${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          ./test/e2e/run.sh
