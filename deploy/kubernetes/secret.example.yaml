# Example Secret for the Contabo credentials. Get the four values from
# https://my.contabo.com/api/details
#
# Do not commit a filled-in copy of this file. It is safer to create the
# Secret straight from your shell:
#
#   kubectl -n external-dns create secret generic contabo-credentials \
#     --from-literal=client-id='INT-12345678' \
#     --from-literal=client-secret='...' \
#     --from-literal=api-user='you@example.com' \
#     --from-literal=api-password='...'
#
# or use a tool such as External Secrets Operator or Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: contabo-credentials
  namespace: external-dns
type: Opaque
stringData:
  client-id: "INT-12345678"
  client-secret: "CHANGE-ME"
  api-user: "you@example.com"
  api-password: "CHANGE-ME"
